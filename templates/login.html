{% extends "base.html" %}
{% block title %}Sign in - Mist License Transfer{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <form method="post" action="{{ url_for('login') }}">
    <label>User name <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
