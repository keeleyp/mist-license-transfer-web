{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Can't continue</h1>
  <div class="flash error pre">{{ message }}</div>
  <p>
    <a href="{{ url_for('index') }}">Try again</a>
    {% if config_count and config_count > 1 %} &middot; <a href="{{ url_for('configs') }}">Choose another config</a>{% endif %}
  </p>
</section>
{% endblock %}
